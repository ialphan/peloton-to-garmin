# This is a workflow that will automatically sync your Peloton rides with Garmin

name: 🔄 Sync Workflow

# Controls when the action will run.
on:
  workflow_dispatch:
    inputs:
      workoutsToDownload:
        type: number
        default: "5"
      saveLocalCopy:
        type: boolean
        default: false
  schedule:
    - cron: '0 1 * * *'

env:
  OUTPUT_DIR: ./output
  DATA_DIR: ./data

jobs:
  sync:
    name: 🔄 Sync
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📁 Create directories
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        mkdir -p ${{ env.DATA_DIR }}

    - name: 🔐 Restore Garmin auth cache
      uses: actions/cache@v4
      with:
        path: ${{ env.DATA_DIR }}/GarminDb.json
        key: garmin-auth-${{ secrets.P2G_GARMIN__EMAIL }}

    - name: 🗃 Create config file
      env:
        DEFAULT_WORKOUT_NUM: 5
      run: |
        cat <<EOT > configuration.local.json
        {
          "App": {
            "EnablePolling": false,
            "CheckForUpdates": true,
            "CloseConsoleOnFinish": true
          },
          "Format": {
            "Fit": true,
            "Json": false,
            "Tcx": false,
            "SaveLocalCopy": ${{ github.event.inputs.saveLocalCopy || false }},
            "IncludeTimeInHRZones": false,
            "IncludeTimeInPowerZones": false,
            "StackedWorkouts": {
              "AutomaticallyStackWorkouts": false,
              "MaxAllowedGapSeconds": 300
            }
          },
          "Peloton": {
            "NumWorkoutsToDownload": ${{ github.event.inputs.workoutsToDownload || env.DEFAULT_WORKOUT_NUM }}
          },
          "Garmin": {
            "Upload": true,
            "FormatToUpload": "fit"
          },
          "Observability": {
            "Prometheus": {
              "Enabled": false
            },
            "Jaeger": {
              "Enabled": false
            },
            "Serilog": {
              "Using": [ "Serilog.Sinks.Console"],
              "MinimumLevel": "Information"
            }
          }
        }
        EOT

    - name: 🔨 Build ConsoleClient
      run: dotnet build src/ConsoleClient/ConsoleClient.csproj -c Release

    - name: ▶ Run P2G Sync
      if: ${{ env.P2G_PELOTON__EMAIL && env.P2G_PELOTON__PASSWORD && env.P2G_GARMIN__EMAIL && env.P2G_GARMIN__PASSWORD }}
      run: dotnet run --project src/ConsoleClient/ConsoleClient.csproj -c Release --no-build
      env:
        P2G_PELOTON__EMAIL: ${{ secrets.P2G_PELOTON__EMAIL }}
        P2G_PELOTON__PASSWORD: ${{ secrets.P2G_PELOTON__PASSWORD }}
        P2G_GARMIN__EMAIL: ${{ secrets.P2G_GARMIN__EMAIL }}
        P2G_GARMIN__PASSWORD: ${{ secrets.P2G_GARMIN__PASSWORD }}
        P2G_GARMIN__SERVICETICKET: ${{ secrets.P2G_GARMIN__SERVICETICKET }}
        TZ: America/Chicago

    - name: 💾 Save Garmin auth cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.DATA_DIR }}/GarminDb.json
        key: garmin-auth-${{ secrets.P2G_GARMIN__EMAIL }}

    - name: ⤴ Upload output directory
      uses: actions/upload-artifact@v4
      if: ${{ github.event.inputs.saveLocalCopy == 'true' }}
      with:
        name: output
        path: ${{ env.OUTPUT_DIR }}
        if-no-files-found: error
